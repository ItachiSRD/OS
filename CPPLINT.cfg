# cpplint configuration for OS development
# Relaxes some Google style guide rules that don't apply to systems programming

# Set line length limit
linelength=100

# Filters to disable specific checks
filter=-build/include_subdir
filter=-build/header_guard
filter=-legal/copyright
filter=-readability/todo
filter=-runtime/int
filter=-runtime/printf
filter=-whitespace/braces
filter=-whitespace/indent
filter=-whitespace/tab
filter=-build/include_order

# Allow C-style headers
filter=-build/c++11

# Relax some rules for OS development
filter=-runtime/explicit
filter=-build/namespaces

# Root directory for header guard calculations
root=src
